
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IPM Sports Grading</title>
  <style>
    body {
      background: #101827;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
    }
    h1 { color: #55d6be; }
    .card {
      background: #202d42;
      border-radius: 16px;
      padding: 20px;
      margin: 15px auto;
      max-width: 400px;
    }
  </style>
</head>
<body>
  <h1>IPM Sports Grading</h1>
  <p>Redefining how we measure athleticism.</p>

  <div class="card">
    <h2>I — Intensity</h2>
    <p>How physically demanding is it?</p>
  </div>

  <div class="card">
    <h2>P — Precision</h2>
    <p>How much physical accuracy is required?</p>
  </div>

  <div class="card">
    <h2>M — Movement</h2>
    <p>How much movement does it require?</p>
  </div>

  <p>Every sport. Three measurements. One scale.</p>
</body>
</html>
